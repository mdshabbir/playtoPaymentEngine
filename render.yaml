services:
  - name: playto-payment-engine-api
    type: web
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate && python manage.py seed_merchants
    startCommand: gunicorn playto_pay.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: playto-payment-engine-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://playto-payment-engine.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://playto-payment-engine-api.onrender.com,https://playto-payment-engine.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: playto-payment-engine-db
          property: connectionString

databases:
  - name: playto-payment-engine-db
